<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToolsIA - Herramientas de Inteligencia Artificial Gratis en Español</title>
  <meta name="description" content="Las mejores herramientas de IA gratis en español. Genera captions, emails, nombres de negocio, ideas para TikTok y resume textos con Inteligencia Artificial." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #07060f; --surface: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.08); --primary: #8b5cf6; --accent: #06b6d4; --text: #f1f5f9; --text-muted: #94a3b8; --radius: 16px; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
    h1 { text-align: center; margin-bottom: 30px; font-size: 2rem; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    h3 { margin-bottom: 10px; }
    input, textarea, select { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px; margin-bottom: 15px; font-family: inherit; }
    button { width: 100%; background: linear-gradient(135deg, var(--primary), var(--accent)); border: none; border-radius: 8px; color: #fff; padding: 12px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .result { margin-top: 15px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px; white-space: pre-wrap; display: none; }
    .api-key-section { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ToolsIA - Herramientas Gratis</h1>
    
    <div class="card api-key-section">
      <h3>1. Configura tu API Key de Google Gemini</h3>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px;">Consiguela gratis en aistudio.google.com</p>
      <input type="password" id="apiKeyInput" placeholder="Pega tu API Key (empieza con AIza...)" />
      <button onclick="saveKey()">Guardar API Key</button>
      <p id="keyStatus" style="color: #10b981; margin-top: 10px; display: none;">¡API Key guardada en tu navegador!</p>
    </div>

    <div class="card">
      <h3>2. Generador de Captions (Instagram / TikTok)</h3>
      <input type="text" id="topicInput" placeholder="¿De qué trata tu foto/video? Ej: Mi café en la mañana" />
      <select id="toneInput">
        <option value="Divertido">Divertido</option>
        <option value="Motivacional">Motivacional</option>
        <option value="Profesional">Profesional</option>
      </select>
      <button onclick="generateCaption()" id="genBtn">Generar Caption con IA</button>
      <div id="resultBox" class="result"></div>
    </div>
  </div>

  <script>
    // Cargar key guardada
    let savedKey = localStorage.getItem('gemini_key');
    if(savedKey) {
      document.getElementById('apiKeyInput').value = savedKey;
      document.getElementById('keyStatus').style.display = 'block';
    }

    function saveKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if(key) {
        localStorage.setItem('gemini_key', key);
        document.getElementById('keyStatus').style.display = 'block';
      } else {
        alert('Ingresa una API Key válida');
      }
    }

    async function generateCaption() {
      const key = localStorage.getItem('gemini_key');
      if(!key) { alert('Primero guarda tu API Key arriba'); return; }

      const topic = document.getElementById('topicInput').value.trim();
      if(!topic) { alert('Ingresa de qué trata tu foto'); return; }

      const tone = document.getElementById('toneInput').value;
      const prompt = "Crea 3 opciones de caption para redes sociales sobre: " + topic + ". Tono: " + tone + ". Incluye emojis y hashtags.";

      const btn = document.getElementById('genBtn');
      const resBox = document.getElementById('resultBox');
      
      btn.textContent = 'Generando...';
      btn.disabled = true;
      resBox.style.display = 'none';

      try {
        // Usamos gemini-1.5-flash y la versión v1beta que es la más estable ahora
        const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + key;
        
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();

        if(!response.ok) {
          throw new Error(data.error?.message || 'Error en la API');
        }

        const text = data.candidates[0].content.parts[0].text;
        resBox.textContent = text;
        resBox.style.display = 'block';
      } catch(err) {
        resBox.textContent = 'Error: ' + err.message + '\n\nVerifica que tu API Key sea correcta (debe empezar con AIza...).';
        resBox.style.display = 'block';
      } finally {
        btn.textContent = 'Generar Caption con IA';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
